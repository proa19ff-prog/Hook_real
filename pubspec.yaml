name: hook
description: "Hook — Android local-first music player with search across sources, synced lyrics and live GLSL themes"
publish_to: "none"
version: 0.4.0+4

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  supabase_flutter: ^2.8.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.6.1

  # Audio Engine & Background Service
  just_audio: ^0.9.40
  audio_service: ^0.18.19
  audio_session: ^0.1.21

  # Public stream sources & network (no private backend or embedded credentials)
  dio: ^5.7.0
  youtube_explode_dart: ^3.1.0
  http: ^1.2.2

  # Theming, Shaders & Dynamic UI
  palette_generator: ^0.3.3+4
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  lottie: ^3.8.1

  # Storage & System
  path_provider: ^2.1.4
  shared_preferences: ^2.3.3
  intl: ^0.20.3
  ming_cute_icons: ^0.0.8
  url_launcher: ^6.3.0
  package_info_plus: ^10.2.2
  just_audio_windows_plus: ^0.5.6
  smtc_windows: ^1.1.0
  file_picker: ^13.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.2

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/app_logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icons/app_logo.png"
  adaptive_icon_monochrome: "assets/icons/app_logo.png"

flutter:
  uses-material-design: true
  generate: true

  # assets/icons/app_logo.png (2 MB) is only the flutter_launcher_icons
  # source, so it is not bundled into the app.
  assets:
    - assets/themes/
    - assets/animations/
    - assets/icons/app_mark.png
    - assets/fonts/OFL.txt

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter-regular/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/inter-medium/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter-semibold/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter-bold/Inter-Bold.ttf
          weight: 700

  shaders:
    - assets/shaders/mesh_gradient.frag
    - assets/shaders/vinyl_noise.frag
